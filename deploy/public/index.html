<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HabitFlow — трекер привычек</title>
<style>
  :root{--bg:#0b1013;--card:#121a1f;--line:#1f2c34;--fg:#e8f1f5;--muted:#7f95a3;--accent:#4ade80;--accent2:#38bdf8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 500px at 50% -10%,#14222b,#0b1013 65%);color:var(--fg);
       font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  h1{font-size:26px;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .add{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .add input[type=text]{flex:1;min-width:180px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
    background:#0e1519;color:var(--fg);font-size:14px;outline:none}
  .add input[type=text]:focus{border-color:var(--accent2)}
  .add input[type=color]{width:46px;height:46px;padding:0;border:1px solid var(--line);border-radius:12px;background:#0e1519;cursor:pointer}
  .add button{padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:#05230f;
    font-weight:800;font-size:14px;cursor:pointer}
  .add button:hover{filter:brightness(1.08)}
  .habit{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
         margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .habit.done{border-color:#2c5c40}
  .hname{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%}
  .meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .meta b{color:var(--fg);font-weight:600}
  .days{display:flex;gap:5px;margin-top:12px}
  .days i{width:100%;max-width:16px;height:16px;border-radius:5px;background:#1b262d;display:block}
  .days i.on{background:var(--accent)}
  .right{display:flex;align-items:center;gap:10px}
  .check{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#0e1519;
    color:var(--muted);font-size:19px;cursor:pointer;transition:.18s}
  .check.on{background:var(--accent);color:#05230f;border-color:var(--accent)}
  .check:hover{transform:scale(1.05)}
  .del{background:none;border:none;color:#4b5c68;font-size:18px;cursor:pointer}
  .del:hover{color:#f87171}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:14px}
  .err{background:#3a1418;border:1px solid #63222a;color:#fda4af;padding:12px 14px;border-radius:12px;
       font-size:13px;margin-bottom:16px;display:none}
  @media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.habit{grid-template-columns:1fr}
    .right{justify-content:flex-end}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Habit<span>Flow</span></h1>
    <span class="sub">трекер привычек · MVP</span>
  </header>

  <div class="kpis">
    <div class="kpi"><b id="k1">0</b><span>привычек</span></div>
    <div class="kpi"><b id="k2">0</b><span>сделано сегодня</span></div>
    <div class="kpi"><b id="k3">0</b><span>лучшая серия</span></div>
    <div class="kpi"><b id="k4">0%</b><span>за 30 дней</span></div>
  </div>

  <div class="err" id="err"></div>

  <div class="add">
    <input id="name" type="text" placeholder="Новая привычка, например «20 минут чтения»" maxlength="80" />
    <input id="color" type="color" value="#4ade80" title="Цвет" />
    <button id="addBtn">Добавить</button>
  </div>

  <div id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');

function showErr(msg){
  const e = $('#err');
  e.textContent = msg;
  e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', 5000);
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function render(habits) {
  list.innerHTML = '';
  if (!habits.length) {
    list.innerHTML = '<div class="empty">Пока пусто. Добавьте первую привычку — и отметьте её сегодня.</div>';
  }
  habits.forEach(h => {
    const el = document.createElement('div');
    el.className = 'habit' + (h.done_today ? ' done' : '');
    const days = h.last14.map(v => `<i class="${v ? 'on' : ''}"></i>`).join('');
    el.innerHTML = `
      <div>
        <div class="hname"><span class="dot" style="background:${h.color}"></span>${escapeHtml(h.name)}</div>
        <div class="meta">
          <span>серия: <b>${h.streak}</b></span>
          <span>лучшая: <b>${h.best}</b></span>
          <span>за 30 дней: <b>${h.done30}%</b></span>
          <span>всего: <b>${h.total}</b></span>
        </div>
        <div class="days">${days}</div>
      </div>
      <div class="right">
        <button class="check ${h.done_today ? 'on' : ''}" title="Отметить сегодня">${h.done_today ? '✓' : '○'}</button>
        <button class="del" title="Удалить">×</button>
      </div>`;
    el.querySelector('.check').onclick = async () => {
      try { await api(`/habits/${h.id}/toggle`, { method: 'POST', body: '{}' }); load(); }
      catch (e) { showErr(e.message); }
    };
    el.querySelector('.del').onclick = async () => {
      if (!confirm('Удалить привычку и все её отметки?')) return;
      try { await api(`/habits/${h.id}`, { method: 'DELETE' }); load(); }
      catch (e) { showErr(e.message); }
    };
    list.appendChild(el);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function load() {
  try {
    const [habits, st] = await Promise.all([api('/habits'), api('/stats')]);
    render(habits);
    $('#k1').textContent = st.habits;
    $('#k2').textContent = st.done_today;
    $('#k3').textContent = st.best_streak;
    $('#k4').textContent = st.avg30 + '%';
  } catch (e) {
    showErr('Нет связи с API: ' + e.message);
  }
}

async function addHabit() {
  const name = $('#name').value.trim();
  if (!name) return;
  try {
    await api('/habits', { method: 'POST', body: JSON.stringify({ name, color: $('#color').value }) });
    $('#name').value = '';
    load();
  } catch (e) { showErr(e.message); }
}

$('#addBtn').onclick = addHabit;
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

load();
</script>
</body>
</html>
